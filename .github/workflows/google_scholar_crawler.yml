name: Get Citation Data (OpenAlex)

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run
        shell: bash
        run: |
          set -euo pipefail
          cd ./google_scholar_crawler

          # 纯标准库实现，无需 pip install 任何第三方包
          python3 main_openalex.py

          cd ./results
          ls -la

          # 推到 google-scholar-stats 分支（与旧流程一致，README 徽章链接无需改动）
          git init -q
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "Updated Citation Data (OpenAlex) [skip ci]"
            git push --force "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats
          fi
        env:
          # 作者定位：三选一，优先级 OPENALEX_AUTHOR_ID > ORCID > AUTHOR_NAME
          # 强烈建议用 OPENALEX_AUTHOR_ID（最精确）
          OPENALEX_AUTHOR_ID: ${{ secrets.OPENALEX_AUTHOR_ID }}
          ORCID: ${{ secrets.ORCID }}
          AUTHOR_NAME: ${{ secrets.AUTHOR_NAME }}

          # 强烈建议配置！无 key 时 OpenAlex 免费额度是全网络共享的 $0.10/天，极易 401
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}

          # 最多拉取多少篇作品生成出版物列表，0 = 全量
          MAX_WORKS: '200'
          CITATION_SOURCE_LABEL: citations
